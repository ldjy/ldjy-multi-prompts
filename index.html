<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Multi-Prompt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Gemini Multi-Tasker <span style="font-size: 0.9rem; color: var(--primary);">v0.4</span></h1>
            <p>一鍵執行多種不同任務，Prompt 為空則自動跳過</p>
            <button id="openSettingsBtn" class="secondary-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                自訂任務 Prompt
            </button>
        </header>

        <section class="settings-card glass-panel">
            <div class="input-group">
                <label for="apiKey">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="輸入您的 Google Gemini API Key" />
                <p class="help-text">Key 會安全地儲存在您的瀏覽器中，不會傳送到其他地方。</p>
            </div>
            <div class="input-group" style="margin-top: 1rem;">
                <div class="label-row">
                    <label for="modelSelect">Gemini 模型選擇</label>
                    <button type="button" id="refreshModelsBtn" class="clear-btn" title="從 Google API 重新抓取最新支援模型清單">
                        🔄 重新載入模型清單
                    </button>
                </div>
                <select id="modelSelect" class="model-select">
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (推薦)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash-8B (極速輕量)</option>
                    <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (深度推理)</option>
                    <option value="custom">✏️ 自訂輸入模型代號...</option>
                </select>
                <input type="text" id="customModelInput" placeholder="輸入模型代號，例如：gemini-3.5-flash-lite" style="display: none; margin-top: 0.5rem;" />
                <p class="help-text" id="modelHelpText">填寫 API Key 後可自動向 Google 載入最新支援模型。</p>
            </div>
        </section>

        <!-- 分頁導覽列 -->
        <div class="tabs-nav">
            <button type="button" class="tab-btn active" id="tabBtnA">任務組 A</button>
            <button type="button" class="tab-btn" id="tabBtnB">任務組 B</button>
        </div>

        <section class="input-card glass-panel">
            <div class="input-group">
                <div class="label-row">
                    <label for="userInput">請輸入要處理的文字</label>
                    <button type="button" id="clearInputBtn" class="clear-btn" title="清空文字">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        清空
                    </button>
                </div>
                <textarea id="userInput" placeholder="貼上文章、句子或任何您想要處理的內容..." rows="5"></textarea>
            </div>
            <button id="executeBtn" class="primary-btn">
                <span class="btn-text">開始執行</span>
                <span class="loader" style="display: none;"></span>
            </button>
        </section>

        <section id="resultsSection" class="results-container" style="display: none;">
            <!-- 結果卡片由 JS 動態生成 -->
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>設定任務 Prompt</h2>
                <button id="closeModalBtn" class="icon-btn">&times;</button>
            </div>
            <div class="modal-tabs-nav">
                <button type="button" class="modal-tab-btn active" id="modalTabBtnA">任務組 A</button>
                <button type="button" class="modal-tab-btn" id="modalTabBtnB">任務組 B</button>
            </div>
            <div class="tab-name-setting">
                <label for="tabNameInput">分頁名稱：</label>
                <input type="text" id="tabNameInput" placeholder="例如：任務組 A" />
            </div>
            <div class="modal-body" id="tasksFormContainer">
                <!-- Forms generated by JS -->
            </div>
            <div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" id="exportPromptsBtn" class="secondary-btn" style="margin-top: 0; padding: 0.5rem 0.8rem; font-size: 0.85rem;" title="複製當前分頁的 10 個 Prompt 備份">📋 備份 Prompt</button>
                    <button type="button" id="importPromptsBtn" class="secondary-btn" style="margin-top: 0; padding: 0.5rem 0.8rem; font-size: 0.85rem;" title="貼上還原 Prompt 備份">📥 匯入 Prompt</button>
                </div>
                <button id="saveTasksBtn" class="primary-btn" style="width: auto; padding: 0.6rem 1.5rem; margin-top: 0;">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 載入 marked.js 用於將 Markdown 轉換為 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
    
    <script>
        // 註冊 Service Worker (PWA 需要)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
